<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0f0f1b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pull-Up Quest">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <title>PULL-UP QUEST</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="crt-overlay"></div>

  <!-- HEADER -->
  <div class="pixel-box header-bar">
    <div class="header-row">
      <div class="green"><span class="blink yellow">►</span> PLAYER 1</div>
      <div class="title-mini">PULL-UP QUEST</div>
      <div class="pink">АПРЕЛЬ 2026</div>
    </div>
  </div>

  <!-- TITLE -->
  <div class="title-block">
    <div class="big-title px-font" id="totalReps">290 REPS</div>
    <div class="px-font subtitle" id="completion">ЧЕЛЛЕНДЖ ПРОЙДЕН НА 62%</div>
    <div class="progress-frame">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats-grid" id="statsGrid"></div>

  <!-- CHART -->
  <div class="pixel-box section">
    <div class="section-title green px-font">[ ОБЪЁМ ПО ДНЯМ ]</div>
    <div class="chart-container">
      <div class="avg-line" id="avgLine">
        <span class="px-font avg-label" id="avgLabel">AVG 18.1</span>
      </div>
      <div class="bars" id="barsContainer"></div>
    </div>
    <div class="legend px-font">
      <div class="legend-item"><div class="swatch" style="background:#fcd60c"></div>MAX</div>
      <div class="legend-item"><div class="swatch" style="background:#5fcb3a"></div>25+</div>
      <div class="legend-item"><div class="swatch" style="background:#3a7be8"></div>15-24</div>
      <div class="legend-item"><div class="swatch" style="background:#2d6a16"></div>10-14</div>
      <div class="legend-item"><div class="swatch" style="background:#e8413a"></div>&lt;10</div>
    </div>
  </div>

  <!-- CALENDAR -->
  <div class="pixel-box section">
    <div class="section-title blue px-font">[ КАРТА ПРОХОЖДЕНИЯ ]</div>
    <div class="calendar-grid" id="calendarGrid"></div>
    <div class="detail-panel" id="detailPanel">
      <div class="px-font detail-empty"><span class="blink">▼</span> ВЫБЕРИ ДЕНЬ <span class="blink">▼</span></div>
    </div>
  </div>

  <!-- ACHIEVEMENTS -->
  <div class="pixel-box section">
    <div class="section-title pink px-font">[ ДОСТИЖЕНИЯ ]</div>
    <div class="achievements-grid" id="achievementsGrid"></div>
  </div>

  <!-- FOOTER -->
  <div class="footer px-font">
    <span class="blink">●</span> PRESS START TO CONTINUE <span class="blink">●</span>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
